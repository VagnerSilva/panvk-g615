name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing panvk-g615-v11-csf-v tag identifying the tested source
        required: true
        type: string
      source_run_id:
        description: Successful same-commit run containing g615-release-candidate
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: g615-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Classify tag
        id: meta
        run: |
          python3 scripts/validate-release-candidate.py tag --tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - name: Verify selected artifact run matches the tag
        run: |
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "FAIL: source_run_id must be numeric" >&2; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 scripts/validate-release-candidate.py run --file "$RUNNER_TEMP/source-run.json" \
            --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"
      - name: Download homologated packages, not CI development artifacts
        run: |
          test ! -e dist
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name g615-release-candidate --dir dist
      - name: Validate packages, binaries, tier and committed screenshots
        run: |
          python3 scripts/validate-release-candidate.py packages --tag "$TAG" --dist dist \
            --repository "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/release-assets.json"
      - name: Publish only validated assets
        run: |
          python3 - "$RUNNER_TEMP/release-assets.json" "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2])
          (root / "release-notes.txt").write_text(data["notes"])
          (root / "release-images.txt").write_text("\n".join(data["imageUrls"]) + "\n")
          PY
          while IFS= read -r url; do
            curl --fail --silent --show-error --head --location "$url"
          done < "$RUNNER_TEMP/release-images.txt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$(git rev-parse HEAD)"
          ASSET_TEXT=$(python3 -c "import json,sys; print('\n'.join(json.load(open(sys.argv[1]))['assets']))" \
            "$RUNNER_TEMP/release-assets.json")
          mapfile -t ASSETS <<< "$ASSET_TEXT"
          FLAGS=()
          if [ '${{ steps.meta.outputs.prerelease }}' = true ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Mesa PanVK $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" "${FLAGS[@]}" "${ASSETS[@]}"
          while IFS= read -r url; do
            curl --fail --silent --show-error --head --location "$url"
          done < "$RUNNER_TEMP/release-images.txt"
